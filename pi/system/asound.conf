# /etc/asound.conf  (written by kenwood-vis install.sh)
#
# Everything that plays sound on the Pi goes to "kenwood_out", which sends
# the SAME audio to two places at once:
#   a) your speakers/amp  (@OUTPUT_CARD@ = Pi headphone jack by default)
#   b) the ALSA loopback  -> the visualizer reads it from hw:Loopback,1,0
# The visualizer never opens a microphone.

pcm.kenwood_out {
    type plug
    slave {
        pcm "kenwood_route"
        format S16_LE
        rate 44100
    }
    hint.description "Speakers + visualizer"
}

pcm.kenwood_route {
    type route
    slave {
        pcm "kenwood_tee"
        channels 4
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

pcm.kenwood_tee {
    type multi
    slaves.a.pcm "hw:@OUTPUT_CARD@,0"
    slaves.a.channels 2
    slaves.b.pcm "hw:Loopback,0,0"
    slaves.b.channels 2
    bindings.0 { slave a; channel 0; }
    bindings.1 { slave a; channel 1; }
    bindings.2 { slave b; channel 0; }
    bindings.3 { slave b; channel 1; }
}

pcm.!default kenwood_out
ctl.!default {
    type hw
    card @OUTPUT_CARD@
}
